<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3a2718">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knight's Tour">
<title>Knight's Tour</title>
<style>
:root{
  --bg:#f3ebdd; --text:#2b1d12; --muted:#7a6550;
  --frame:#3a2718; --label:#f2b544;
  --light:#f0d9b5; --dark:#b58863;
  --fixed-bg:#8e1f1f; --fixed-text:#fff;
  --num:#2b1d12;
  --panel:#fffaf2; --panel-border:#d9c8b0;
  --btn:#3a2718; --btn-text:#fbefdc; --btn2:#e6d7c1; --btn2-text:#3a2718;
  --path:rgba(58,39,24,.5); --dot:rgba(58,39,24,.38); --current:#2d7d46;
  --x:#d42020; --halo:#f6ead6;
}
body.night{
  --bg:#14100c; --text:#efe3d1; --muted:#a8957d;
  --frame:#2a1c11; --label:#f2b544;
  --light:#8f7b62; --dark:#5a4532;
  --fixed-bg:#c0392b; --fixed-text:#fff;
  --num:#fff6e8;
  --panel:#221a13; --panel-border:#4a3a2a;
  --btn:#f2b544; --btn-text:#1a120b; --btn2:#3a2c20; --btn2-text:#efe3d1;
  --path:rgba(255,230,190,.55); --dot:rgba(255,240,215,.5); --current:#5fd38a;
  --x:#ff3b3b; --halo:#2a1d12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px 24px;
  transition:background .25s,color .25s;
}
header{width:100%;max-width:560px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,7vw,38px);margin:4px 0 2px;letter-spacing:.5px}
.tagline{margin:0;color:var(--muted);font-size:15px}
.gear{background:none;border:0;color:var(--text);font-size:30px;line-height:1;cursor:pointer;padding:6px;border-radius:10px;touch-action:manipulation;transition:transform .3s cubic-bezier(.2,.9,.25,1),background .15s}
.gear:hover{background:var(--btn2)}
.gear:active{transform:scale(.9);transition-duration:.05s}
body:has(#settings.open) .gear{transform:rotate(60deg)}

.status{width:100%;max-width:560px;margin:14px 0 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;font-size:15px;min-height:36px}
.status b{font-size:18px}
.seg{display:inline-flex;border:1px solid var(--panel-border);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--text);border:0;padding:6px 14px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btn-text);font-weight:700}
.notice{width:100%;max-width:560px;min-height:22px;color:var(--muted);font-size:14px;margin-bottom:8px;text-align:center}
.notice.warn{color:var(--x);font-weight:600}

.frame{
  width:min(100%,560px); background:var(--frame); border-radius:14px; padding:10px 12px 4px 4px;
  display:grid; grid-template-columns:24px 1fr; grid-template-rows:auto 24px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.ranks{display:grid;grid-template-rows:repeat(8,1fr)}
.files{grid-column:2;display:grid;grid-template-columns:repeat(8,1fr)}
.ranks span,.files span{display:flex;align-items:center;justify-content:center;color:var(--label);font-weight:800;font-size:15px;font-family:Georgia,serif}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;container-type:inline-size;border-radius:4px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-weight:700;color:var(--num);font-size:5.2cqw}
.cell.l{background:var(--light)} .cell.d{background:var(--dark)}
.cell .fx{position:relative;z-index:2;width:78%;height:78%;border-radius:50%;background:var(--fixed-bg);color:var(--fixed-text);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.cell .pl{position:relative;z-index:2;text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 6px var(--halo)}
.cell.cur::after{content:"";position:absolute;inset:7%;border:3px solid var(--current);border-radius:50%}
.cell.hint::before{content:"";width:22%;height:22%;border-radius:50%;background:var(--dot)}
.cell.pop .pl,.cell.pop .fx{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:.2}to{transform:scale(1);opacity:1}}
.cell.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
/* press feedback: tint + number presses in the moment the pointer goes down */
.cell{touch-action:manipulation;transition:box-shadow .12s ease-out}
.cell>span{transition:scale .12s ease-out}
.cell.press{box-shadow:inset 0 0 0 100px rgba(0,0,0,.16);transition-duration:0s}
.cell.press>span{scale:.9;transition-duration:.05s}
@media (prefers-reduced-motion:reduce){.cell>span,.cell.press>span{transition:none}.cell.press>span{scale:1}}
svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
svg.path polyline,svg.path line{stroke:var(--path);stroke-width:.05;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* segments are drawn from n toward n+1 (pathLength=1); the offset starts just past the end so no cap dot shows early */
svg.path line{stroke-dasharray:1 2;stroke-dashoffset:0;transition:opacity .15s ease-out}
svg.path line.draw{animation:linedraw .16s ease-out backwards}
svg.path line.out{opacity:0}
@keyframes linedraw{from{stroke-dashoffset:1.05}}
@media (prefers-reduced-motion:reduce){svg.path line.draw{animation:none}}

.controls{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;background:var(--btn2);color:var(--btn2-text);min-width:100px}
.btn.primary{background:var(--btn);color:var(--btn-text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.rules{max-width:560px;color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:18px;text-align:center}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel);color:var(--text);border:1px solid var(--panel-border);border-radius:16px;padding:18px;width:min(100%,320px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet h2{margin:0 0 12px;font-size:20px;font-family:Georgia,serif}
.pad-display{font-size:34px;font-weight:800;text-align:center;border:2px solid var(--panel-border);border-radius:12px;padding:8px;margin-bottom:12px;min-height:58px;letter-spacing:2px}
.pad-display::after{content:"";display:inline-block;width:2px;height:.85em;background:var(--muted);margin-left:3px;vertical-align:-.08em;animation:caret 1s steps(1) infinite}
.pad-display:empty::before{content:"1–64";color:var(--muted);opacity:.45;font-size:.55em;font-weight:600;letter-spacing:1px}
@keyframes caret{50%{opacity:0}}
.pad-display.bad{border-color:var(--x)}
.pad-display.shake{animation:shake .35s}
.pad-err{min-height:3.9em;margin:0 0 10px;color:var(--x);font-size:13px;font-weight:600;line-height:1.3;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{font-size:22px;font-weight:700;padding:12px 0;border-radius:12px;border:0;background:var(--btn2);color:var(--btn2-text);cursor:pointer;touch-action:manipulation;transition:transform .12s ease-out}
.keys button:active{transform:scale(.93);transition-duration:.05s}
.keys button.ok{background:var(--btn);color:var(--btn-text)}
/* number pad: fade + scale from the tapped cell, same path in and out */
#pad.modal{display:flex;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .18s ease-out,visibility 0s linear .18s}
#pad.modal.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .18s ease-out}
#pad .sheet{transform:scale(.88);transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .18s ease-in}
#pad.open .sheet{transform:none;transition:transform .26s cubic-bezier(.2,.9,.25,1)}
@media (prefers-reduced-motion:reduce){
  #pad .sheet,#pad.open .sheet{transform:none;transition:none}
  .pad-display::after{animation:none}
  .pad-display.shake{animation:none}
}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1;min-width:0}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--panel-border);font-size:17px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:#9b8b78;border:0;cursor:pointer;transition:background .2s;touch-action:manipulation}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .26s cubic-bezier(.2,.9,.25,1),width .12s ease-out}
.sw:active::after{width:28px}
.sw.on{background:#2d7d46}.sw.on::after{transform:translateX(22px)}
.sw.on:active::after{transform:translateX(18px)}
/* settings panel: fade + scale from the gear, same path in and out */
#settings.modal{display:flex;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .18s ease-in,visibility 0s linear .18s}
#settings.modal.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .15s ease-out}
#settings .sheet{transform:scale(.88);transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .18s ease-in}
#settings.open .sheet{transform:none;transition:transform .26s cubic-bezier(.2,.9,.25,1)}
/* night mode eases instead of flashing (class is only on during the toggle) */
body.theming *:not(.sw),body.theming *:not(.sw)::before,body.theming *:not(.sw)::after{transition:background-color .28s ease,color .28s ease,border-color .28s ease,stroke .28s ease,box-shadow .28s ease!important}
@media (prefers-reduced-motion:reduce){
  #settings .sheet,#settings.open .sheet{transform:none;transition:none}
  body:has(#settings.open) .gear,.gear:active{transform:none}
}

/* Forbidden */
.forbid{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:20px;text-align:center;cursor:pointer;
  visibility:hidden;opacity:0;pointer-events:none;transition:opacity .18s ease-in,visibility 0s linear .18s}
.forbid.open{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .15s ease-out}
.forbid svg{width:min(70vw,340px);height:min(70vw,340px);filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));transform:scale(.8);transition:transform .18s ease-in}
.forbid.open svg{transform:none;transition:transform .22s cubic-bezier(.2,.9,.25,1)}
/* strokes rest fully drawn, so the X stays whole while the overlay fades out */
.forbid svg line{stroke:var(--x);stroke-width:22;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:0}
.forbid.open svg line{animation:draw .1s ease-out backwards}
.forbid.open svg line:nth-child(2){animation-delay:.07s}
@keyframes draw{from{stroke-dashoffset:400}}
@media (prefers-reduced-motion:reduce){
  .forbid svg,.forbid.open svg{transform:none;transition:none}
  .forbid.open svg line{animation:none}
}
.forbid h3{color:#fff;font-size:clamp(34px,10vw,56px);margin:6px 0 6px;letter-spacing:4px;font-family:Georgia,serif;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.forbid p{color:#fff;font-size:17px;max-width:420px;margin:0;line-height:1.45;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.forbid small{color:#ddd;margin-top:14px;font-size:13px}

.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;z-index:70;
  background:#2d7d46;color:#fff;font-weight:800;font-size:clamp(20px,6vw,28px);padding:16px 26px;border-radius:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);transition:opacity .2s,transform .2s;text-align:center;white-space:nowrap}
.toast.warn{background:#b8741a}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.win h2{font-size:30px;text-align:center}
.win p{text-align:center;font-size:16px;margin:0 0 6px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Knight's Tour</h1>
    <p class="tagline">Visit every square once. Number them 1 to 64.</p>
  </div>
  <button class="gear" id="gearBtn" aria-label="Settings">⚙</button>
</header>

<div class="status" id="status"></div>
<div class="notice" id="notice"></div>

<div class="frame">
  <div class="ranks" id="ranks"></div>
  <div class="board" id="board"></div>
  <div class="files" id="files"></div>
</div>

<div class="controls" id="controls"></div>
<p class="rules" id="rules"></p>

<!-- Number pad -->
<div class="modal" id="pad">
  <div class="sheet">
    <h2>Square <span id="padSq"></span></h2>
    <div class="pad-display" id="padDisp"></div>
    <div class="pad-err" id="padErr" role="alert"></div>
    <div class="keys" id="keys"></div>
    <div class="row">
      <button class="btn" id="padRemove">Remove</button>
      <button class="btn" id="padCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="modal" id="settings">
  <div class="sheet">
    <h2>Settings</h2>
    <div class="toggle"><span>Night mode</span><button class="sw" id="swNight" role="switch" aria-checked="false" aria-label="Night mode"></button></div>
    <div class="toggle"><span>Sound</span><button class="sw" id="swSound" role="switch" aria-checked="false" aria-label="Sound"></button></div>
    <div class="row"><button class="btn primary" id="setDone">Done</button></div>
  </div>
</div>

<!-- Confirm solve -->
<div class="modal" id="confirm">
  <div class="sheet">
    <h2>Show the solution?</h2>
    <p style="margin:0 0 6px;line-height:1.45">The knight will fill the whole board for you. Your own moves will be replaced.</p>
    <div class="row">
      <button class="btn primary" id="confShow">Show</button>
      <button class="btn" id="confCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Win -->
<div class="modal win" id="win">
  <div class="sheet">
    <h2>🏆 You did it!</h2>
    <p id="winText"></p>
    <div class="row"><button class="btn primary" id="winNew">New game</button><button class="btn" id="winClose">Close</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<!-- Forbidden -->
<div class="forbid" id="forbid">
  <svg viewBox="0 0 200 200"><line x1="30" y1="30" x2="170" y2="170"/><line x1="170" y1="30" x2="30" y2="170"/></svg>
  <h3>FORBIDDEN</h3>
  <p id="forbidText"></p>
  <small>Tap to continue</small>
</div>

<script>
"use strict";
/* ---------- Board geometry ---------- */
const FILES = "ABCDEFGH";
const sqName = s => FILES[s % 8] + (Math.floor(s / 8) + 1);
const MOVES = [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const NB = [];
const ADJ = new Uint8Array(64 * 64);
for (let s = 0; s < 64; s++) {
  const x = s % 8, y = s >> 3; NB[s] = [];
  for (const [a, b] of MOVES) {
    const X = x + a, Y = y + b;
    if (X >= 0 && X < 8 && Y >= 0 && Y < 8) { NB[s].push(Y * 8 + X); ADJ[s * 64 + Y * 8 + X] = 1; }
  }
}
const DIST = [];
for (let s = 0; s < 64; s++) {
  const d = new Array(64).fill(-1); d[s] = 0; const q = [s];
  for (let i = 0; i < q.length; i++) for (const t of NB[q[i]]) if (d[t] < 0) { d[t] = d[q[i]] + 1; q.push(t); }
  DIST[s] = d;
}
const isDarkSq = s => ((s % 8) + (s >> 3)) % 2 === 0; // A1 is dark

/* next fixed number after n */
function nextFixed(fixed, n) {
  let best = 0;
  for (const k in fixed) { const v = +k; if (v > n && (!best || v < best)) best = v; }
  return best;
}
/* can the knight standing on q at number n still reach the next fixed number exactly on time? */
function reachOK(fixed, q, n) {
  const k = nextFixed(fixed, n); if (!k) return true;
  const d = DIST[q][fixed[k]], st = k - n;
  return d <= st && ((st - d) & 1) === 0;
}

/* Quick checks that need no search. Returns a reason string, or "" if OK. */
function staticProblem(fixed) {
  const fixedAt = {}; for (const k in fixed) fixedAt[fixed[k]] = +k;
  const ks = Object.keys(fixed).map(Number);
  // numbers two apart need a free square between them
  for (const a of ks) for (const b of ks) if (b - a === 2) {
    const ok = NB[fixed[a]].some(t => ADJ[t * 64 + fixed[b]] && (fixedAt[t] === undefined || fixedAt[t] === a + 1));
    if (!ok) return `${a} on ${sqName(fixed[a])} and ${b} on ${sqName(fixed[b])} need a free square between them for ${a + 1}, and there isn't one.`;
  }
  // every square must have room to come in and go out
  for (let u = 0; u < 64; u++) {
    const k = fixedAt[u];
    let free = 0; const fx = [];
    for (const t of NB[u]) { const kt = fixedAt[t]; if (kt === undefined) free++; else fx.push(kt); }
    let usable;
    if (k !== undefined) usable = free + fx.filter(x => Math.abs(x - k) === 1).length;
    else {
      let pair = false; for (const x of fx) for (const y of fx) if (y - x === 2) pair = true;
      usable = free + (fx.length ? (pair ? 2 : 1) : 0);
      // surrounded only by fixed numbers: it must be square 1 (next to 2) or 64 (next to 63)
      if (free === 0 && fx.length && !pair && !fx.includes(2) && !fx.includes(63)) usable = 0;
    }
    const endOK = k === undefined || k === 1 || k === 64;
    if (usable === 0 || (usable === 1 && !endOK)) {
      return `Square ${sqName(u)} gets boxed in — the squares a knight could use to reach it are blocked by your numbers.`;
    }
  }
  return "";
}

/* ---------- Solver: backtracking + Warnsdorff + dead-square pruning ---------- */
function solveTour(fixed, totalBudget = 1.5e6) {
  if (staticProblem(fixed)) return { path: null, proven: true };
  const fixedAt = new Int8Array(64);
  for (const k in fixed) fixedAt[fixed[k]] = +k;
  const nf = new Int32Array(66);
  for (let n = 0; n <= 64; n++) nf[n] = nextFixed(fixed, n);
  const reach = (q, n) => { const k = nf[n]; if (!k) return true; const d = DIST[q][fixed[k]], st = k - n; return d <= st && ((st - d) & 1) === 0; };
  const vis = new Uint8Array(64), path = new Array(65);
  let nodes = 0, limit = 0, used = 0;
  const deg = q => { let c = 0; for (const t of NB[q]) if (!vis[t]) c++; return c; };
  const seen = new Uint8Array(64), queue = new Int8Array(64);
  function dead(cur, n) {
    if (n === 64) return false;
    let ends = 0, unv = 0;
    for (let u = 0; u < 64; u++) {
      if (vis[u]) continue;
      unv++;
      let f = 0;
      if (fixedAt[u]) { for (const t of NB[u]) if (!vis[t]) f++; }
      else {
        // a free square can touch at most one fixed square in the tour (two only if their numbers differ by 2)
        let fx1 = 0, fx2 = 0, pair = false;
        for (const t of NB[u]) {
          if (vis[t]) continue;
          const k = fixedAt[t];
          if (!k) f++;
          else if (!fx1) fx1 = k;
          else { if (Math.abs(k - fx1) === 2 || (fx2 && Math.abs(k - fx2) === 2)) pair = true; fx2 = k; }
        }
        // only fixed neighbours and no pair: this square must be the last one (64), next to 63
        if (f === 0 && fx1 && !pair && !ADJ[cur * 64 + u] && fx1 !== 63 && fx2 !== 63) return true;
        f += fx1 ? (pair ? 2 : 1) : 0;
      }
      const adj = ADJ[cur * 64 + u];
      if (f === 0) { if (!adj || n + 1 !== 64) return true; ends++; }
      else if (f === 1 && !adj) { if (fixedAt[u] && fixedAt[u] !== 64) return true; ends++; }
      if (ends > 1) return true;
      const k = fixedAt[u];
      if (k && k > n + 1) {
        // a fixed square needs room for k-1 (before) and k+1 (after)
        let room = 0;
        for (const t of NB[u]) if (!vis[t] && (!fixedAt[t] || fixedAt[t] === k - 1 || fixedAt[t] === k + 1)) room++;
        if (room < (k === 64 ? 1 : 2)) return true;
      }
    }
    // every unvisited square must still be reachable from the knight
    seen.fill(0); let h = 0, tl = 0, cnt = 0;
    for (const t of NB[cur]) if (!vis[t] && !seen[t]) { seen[t] = 1; queue[tl++] = t; }
    while (h < tl) { const u = queue[h++]; cnt++; for (const t of NB[u]) if (!vis[t] && !seen[t]) { seen[t] = 1; queue[tl++] = t; } }
    return cnt !== unv;
  }
  function order(c) {
    const k = c.map(q => [deg(q) + Math.random() * 0.9, q]);
    k.sort((a, b) => a[0] - b[0]);
    return k.map(e => e[1]);
  }
  function place(q, m) {
    vis[q] = 1; path[m] = q;
    if (!dead(q, m) && rec(q, m)) return true;
    vis[q] = 0; return false;
  }
  function rec(cur, n) {
    if (n === 64) return true;
    if (++nodes > limit) throw "limit";
    const m = n + 1;
    if (fixed[m] !== undefined) {
      const q = fixed[m];
      if (vis[q] || !ADJ[cur * 64 + q]) return false;
      return place(q, m);
    }
    const c = [];
    for (const q of NB[cur]) if (!vis[q] && !fixedAt[q] && reach(q, m)) c.push(q);
    for (const q of order(c)) if (place(q, m)) return true;
    return false;
  }
  let starts;
  if (fixed[1] !== undefined) starts = [fixed[1]];
  else { starts = []; for (let q = 0; q < 64; q++) if (!fixedAt[q] && reach(q, 1)) starts.push(q); }
  for (let attempt = 0; used < totalBudget; attempt++) {
    limit = Math.min(Math.floor(2000 * Math.pow(1.35, attempt)), totalBudget - used); nodes = 0;
    vis.fill(0);
    try {
      let ok = false;
      for (const s of order(starts)) { if (place(s, 1)) { ok = true; break; } }
      used += nodes;
      if (ok) return { path: path.slice(), proven: true };
      return { path: null, proven: true };         // full search finished: impossible
    } catch (e) { used += nodes; }
  }
  return { path: null, proven: false };            // ran out of time
}

/* ---------- Sound ---------- */
let actx = null;
function audio() {
  if (!settings.sound) return null;
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, dur, type, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}
const sndBuzz = () => { tone(110, 0.55, "sawtooth", 0.28); tone(82, 0.55, "square", 0.18); tone(110, 0.35, "sawtooth", 0.22, 0.6); };
const sndTick = () => tone(740, 0.08, "triangle", 0.18);
const sndStart = () => [392, 523, 659].forEach((f, i) => tone(f, 0.22, "triangle", 0.2, i * 0.09));
const sndWin  = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.35, "triangle", 0.22, i * 0.13));

/* ---------- Settings ---------- */
const settings = { night: false, sound: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem("kt-settings") || "{}")); } catch (e) {}
function saveSettings() { try { localStorage.setItem("kt-settings", JSON.stringify(settings)); } catch (e) {} }
function applySettings() {
  document.body.classList.toggle("night", settings.night);
  $("swNight").classList.toggle("on", settings.night);
  $("swSound").classList.toggle("on", settings.sound);
  $("swNight").setAttribute("aria-checked", settings.night); $("swSound").setAttribute("aria-checked", settings.sound);
  document.querySelector('meta[name="theme-color"]').content = settings.night ? "#14100c" : "#3a2718";
}

/* ---------- State ---------- */
const $ = id => document.getElementById(id);
const S = {
  phase: "setup",       // setup | play | solved | won
  count: 2,             // how many numbers the player chooses (2 or 3)
  fixed: {},            // number -> square
  board: new Array(64).fill(0),
  posOf: new Array(66).fill(-1),
  next: 1, history: [], solution: null,
  start: 0, timerId: null, animId: null,
};
try { const c = +localStorage.getItem("kt-count"); if (c === 2 || c === 3) S.count = c; } catch (e) {}

/* ---------- Build board ---------- */
const cells = [];
(function build() {
  for (let r = 0; r < 8; r++) { const sp = document.createElement("span"); sp.textContent = 8 - r; $("ranks").appendChild(sp); }
  for (let c = 0; c < 8; c++) { const sp = document.createElement("span"); sp.textContent = FILES[c]; $("files").appendChild(sp); }
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const s = (7 - r) * 8 + c, el = document.createElement("div");
    el.className = "cell " + (isDarkSq(s) ? "d" : "l");
    el.dataset.sq = s; el.title = sqName(s);
    el.addEventListener("pointerdown", e => {
      if (!e.isPrimary || e.button !== 0 || (S.phase !== "setup" && S.phase !== "play")) return;
      press = { s, el, id: e.pointerId }; el.classList.add("press");
    });
    el.addEventListener("click", e => { if (e.detail === 0) onCell(s); }); // keyboard / programmatic; pointer taps commit on pointerup
    $("board").appendChild(el); cells[s] = el;
  }
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 8 8"); svg.setAttribute("class", "path"); svg.id = "pathSvg";
  $("board").appendChild(svg);
})();
/* Press: highlight on down, commit on up, cancel if dragged away (10px slack), re-arm if dragged back */
let press = null;
const nearCell = (e, el, slack = 10) => {
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left - slack && e.clientX <= r.right + slack && e.clientY >= r.top - slack && e.clientY <= r.bottom + slack;
};
document.addEventListener("pointermove", e => {
  if (press && e.pointerId === press.id) press.el.classList.toggle("press", nearCell(e, press.el));
});
document.addEventListener("pointerup", e => {
  if (!press || e.pointerId !== press.id) return;
  const { s, el } = press; press = null;
  el.classList.remove("press");
  if (nearCell(e, el)) onCell(s);
});
document.addEventListener("pointercancel", e => {
  if (!press || e.pointerId !== press.id) return;
  press.el.classList.remove("press"); press = null;
});
const center = s => [(s % 8) + 0.5, 7 - (s >> 3) + 0.5];

/* ---------- Rendering ---------- */
/* One <line> per segment, kept between renders: new ones draw in, removed ones fade out. */
const pathLines = new Map();
function syncPath(want) {
  const svg = $("pathSvg");
  for (const [k, el] of pathLines) if (!want.has(k)) {
    pathLines.delete(k); el.classList.add("out"); setTimeout(() => el.remove(), 180);
  }
  for (const [k, [a, b]] of want) if (!pathLines.has(k)) {
    const [x1, y1] = center(a), [x2, y2] = center(b);
    const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
    el.setAttribute("x1", x1); el.setAttribute("y1", y1); el.setAttribute("x2", x2); el.setAttribute("y2", y2);
    el.setAttribute("pathLength", "1"); el.setAttribute("class", "draw");
    svg.appendChild(el); pathLines.set(k, el);
  }
}
function render(popSq = -1) {
  const fixedAt = {}; for (const k in S.fixed) fixedAt[S.fixed[k]] = +k;
  for (let s = 0; s < 64; s++) {
    const el = cells[s];
    el.className = "cell " + (isDarkSq(s) ? "d" : "l") + (s === popSq ? " pop" : "");
    if (fixedAt[s] !== undefined) el.innerHTML = `<span class="fx">${fixedAt[s]}</span>`;
    else if (S.board[s]) el.innerHTML = `<span class="pl">${S.board[s]}</span>`;
    else el.innerHTML = "";
  }
  // path lines between consecutive numbers that are both on the board
  const want = new Map();
  if (S.phase === "play" || (S.phase === "solved" && S.animating)) for (let n = 1; n < 64; n++) {
    const a = S.posOf[n], b = S.posOf[n + 1];
    if (a >= 0 && b >= 0) want.set(`${n}:${a}:${b}`, [a, b]);
  }
  syncPath(want);
  renderStatus(); renderControls();
}

function placedCount() { return Object.keys(S.fixed).length; }
function fmtTime(ms) { const t = Math.floor(ms / 1000); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }

function renderStatus() {
  const st = $("status");
  if (S.phase === "setup") {
    st.innerHTML = `<span>Choose <b>${S.count}</b> numbers · placed <b>${placedCount()}</b>/${S.count}</span>
      <span class="seg" id="seg"><button data-c="2" class="${S.count === 2 ? "on" : ""}">2</button><button data-c="3" class="${S.count === 3 ? "on" : ""}">3</button></span>`;
    st.querySelectorAll("#seg button").forEach(b => b.onclick = () => setCount(+b.dataset.c));
    $("rules").textContent = "Tap any square and type a number from 1 to 64. When your numbers are set, press Start. A knight moves in an L: two squares one way, then one square to the side.";
  } else if (S.phase === "play") {
    const placed = S.posOf.slice(1, 65).filter(v => v >= 0).length;
    st.innerHTML = `<span>Placed <b>${placed}</b>/64</span><span>Time <b id="time">${fmtTime(Date.now() - S.start)}</b></span>`;
    $("rules").textContent = "Tap any empty square and type its number — in any order you like. Tap one of your numbers to change or remove it. Numbers in a row (like 4 and 5) must be one knight move apart.";
  } else if (S.phase === "solved") {
    st.innerHTML = `<span>Solution shown</span><span>Placed <b>64</b>/64</span>`;
    $("rules").textContent = "This is one possible tour. Press New game to try again with new numbers.";
  } else {
    st.innerHTML = `<span>Solved! 🏆</span><span>Time <b>${fmtTime(S.endTime - S.start)}</b></span>`;
    $("rules").textContent = "Amazing — every square visited exactly once.";
  }
}

function renderControls() {
  const c = $("controls"); c.innerHTML = "";
  const add = (label, fn, primary, disabled) => {
    const b = document.createElement("button"); b.className = "btn" + (primary ? " primary" : "");
    b.textContent = label; b.onclick = fn; b.disabled = !!disabled; c.appendChild(b); return b;
  };
  if (S.phase === "setup") {
    add("Clear", clearSetup, false, placedCount() === 0);
    add("Start", startGame, true);
  } else if (S.phase === "play") {
    add("Undo", undo, false, S.history.length === 0);
    add("New game", newGame);
    add("Solve", () => openModal("confirm"), true);
  } else {
    add("New game", newGame, true);
  }
}

function notice(msg, warn) { const n = $("notice"); n.textContent = msg || ""; n.classList.toggle("warn", !!warn); }

/* ---------- Toast banner ---------- */
let toastTimer = null;
function toast(msg, warn) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("warn", !!warn);
  t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  if (warn) sndWarn();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
const sndWarn = () => tone(330, 0.18, "triangle", 0.2);

/* ---------- Forbidden ---------- */
let forbidTimer = null;
function forbid(reason, sq) {
  $("forbidText").textContent = reason;
  const f = $("forbid"); f.classList.remove("open"); void f.offsetWidth; f.classList.add("open");
  sndBuzz(); if (navigator.vibrate) navigator.vibrate([40, 40, 60]);
  if (sq >= 0) { cells[sq].classList.remove("shake"); void cells[sq].offsetWidth; cells[sq].classList.add("shake"); }
  clearTimeout(forbidTimer); forbidTimer = setTimeout(() => f.classList.remove("open"), 3200);
}
$("forbid").onclick = () => { clearTimeout(forbidTimer); $("forbid").classList.remove("open"); };
document.addEventListener("keydown", e => {   // any key dismisses (not held keys or bare modifiers)
  if (e.repeat || ["Shift", "Control", "Alt", "Meta"].includes(e.key) || !$("forbid").classList.contains("open")) return;
  $("forbid").onclick();
});

/* ---------- Setup phase ---------- */
function setCount(c) {
  S.count = c; try { localStorage.setItem("kt-count", c); } catch (e) {}
  if (placedCount() > c) notice(`You have ${placedCount()} numbers. Remove one to continue.`, true); else notice("");
  render();
}
function clearSetup() { S.fixed = {}; notice(""); render(); }

let padSq = -1, padVal = "";
function onCell(s) {
  if (S.phase === "setup") return openPad(s);
  if (S.phase === "play") {
    if (Object.values(S.fixed).includes(s)) { notice("Red numbers are fixed and can't be changed.", true); cells[s].classList.remove("shake"); void cells[s].offsetWidth; cells[s].classList.add("shake"); return; }
    return openPad(s);
  }
}
/* number -> square for everything on the board right now */
function currentNumbers() {
  if (S.phase === "setup") return Object.assign({}, S.fixed);
  const m = {}; for (let s = 0; s < 64; s++) if (S.board[s]) m[S.board[s]] = s; return m;
}
function openPad(s) {
  padSq = s; padVal = "";
  const nums = currentNumbers();
  const existing = Object.keys(nums).find(k => nums[k] === s) || "";
  $("padSq").textContent = sqName(s);
  $("padRemove").style.display = existing ? "" : "none";
  $("padDisp").textContent = existing;
  $("padDisp").dataset.old = existing;
  clearPadErr();
  // grow the sheet out of the tapped cell
  const r = cells[s].getBoundingClientRect(), sh = document.querySelector("#pad .sheet");
  const de = document.documentElement;
  const left = (de.clientWidth - sh.offsetWidth) / 2, top = (de.clientHeight - sh.offsetHeight) / 2;
  $("pad").style.setProperty("--ox", (r.left + r.width / 2 - left) + "px");
  $("pad").style.setProperty("--oy", (r.top + r.height / 2 - top) + "px");
  openModal("pad");
}
(function buildKeys() {
  const k = $("keys");
  ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(v => {
    const b = document.createElement("button"); b.textContent = v; if (v === "OK") b.className = "ok";
    if (v === "OK") b.onclick = () => padKey(v);          // commit on release
    else b.addEventListener("pointerdown", e => { e.preventDefault(); padKey(v); }); // digits act on press
    k.appendChild(b);
  });
})();
function clearPadErr() { $("padErr").textContent = ""; $("padDisp").classList.remove("bad", "shake"); }
function showPadErr(msg) {
  $("padErr").textContent = msg;
  const d = $("padDisp"); d.classList.add("bad"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
}
/* Reason the typed number can't go on the tapped square, or "" if it's fine. */
function padProblem() {
  const n = parseInt(padVal, 10), old = $("padDisp").dataset.old;
  const others = currentNumbers(); if (old) delete others[old];
  if (S.phase === "setup" && Object.keys(others).length >= S.count) return `You can only choose ${S.count} numbers. Remove one first.`;
  return ruleProblem(padSq, n, others);
}
function padKey(v) {
  if (v === "OK") return padOK();
  if (v === "⌫") padVal = padVal.slice(0, -1);
  else if (padVal.length < 2) padVal += v;
  else return;
  sndTick();
  $("padDisp").textContent = padVal;
  clearPadErr();
  // check as they type, but not while a 1–6 could still become a two-digit number
  if (padVal && !(padVal.length === 1 && +padVal >= 1 && +padVal <= 6)) { const why = padProblem(); if (why) showPadErr(why); }
}
/* Check number n on square s against all the other numbers. Returns a reason, or "". */
function ruleProblem(s, n, others) {
  if (!(n >= 1 && n <= 64)) return "Choose a number from 1 to 64.";
  if (others[n] !== undefined) return `${n} is already on the board (${sqName(others[n])}).`;
  for (const k in others) {
    const m = +k, q = others[k], steps = Math.abs(n - m), d = DIST[s][q];
    const lo = Math.min(n, m), hi = Math.max(n, m);
    if (steps === 1 && d !== 1) return `${n} must be one knight move from ${m} on ${sqName(q)} — two squares one way, then one to the side.`;
    const sameColor = isDarkSq(s) === isDarkSq(q);
    if ((steps % 2 === 0) !== sameColor)
      return `Colour rule: ${lo} and ${hi} are ${steps} moves apart, so they must be on ${steps % 2 === 0 ? "the SAME" : "DIFFERENT"} colour squares. ${sqName(s)} and ${sqName(q)} are ${sameColor ? "the same" : "different"} colours.`;
    if (d > steps)
      return `Too far: a knight needs at least ${d} moves to go from ${sqName(s)} to ${sqName(q)}, but ${lo} and ${hi} are only ${steps} moves apart.`;
  }
  return staticProblem(Object.assign({}, others, { [n]: s }));
}
function setCell(s, n) {
  const old = S.board[s]; if (old) S.posOf[old] = -1;
  S.board[s] = n; if (n) S.posOf[n] = s;
}
function padOK() {
  if (padVal === "") return closeModal("pad");
  const why = padProblem();
  if (why) return showPadErr(why);      // keep the pad open so they can fix it
  const s = padSq, n = parseInt(padVal, 10), old = $("padDisp").dataset.old;
  closeModal("pad");
  sndTick(); notice("");
  if (S.phase === "setup") { if (old) delete S.fixed[old]; S.fixed[n] = s; return render(s); }
  S.history.push({ s, before: S.board[s], after: n });
  setCell(s, n);
  if (S.board.every(v => v)) return win(s);
  render(s);
}
$("padRemove").onclick = () => {
  const old = $("padDisp").dataset.old; closeModal("pad"); if (!old) return;
  if (S.phase === "setup") delete S.fixed[old];
  else { S.history.push({ s: padSq, before: +old, after: 0 }); setCell(padSq, 0); }
  notice(""); render();
};
$("padCancel").onclick = () => closeModal("pad");

function startGame() {
  const have = placedCount(), need = S.count - have;
  if (need > 0) { toast(`Place ${need} more number${need > 1 ? "s" : ""} first`, true); notice(`Tap a square and type a number — ${have} of ${S.count} placed.`, true); return; }
  if (need < 0) { toast(`Remove ${-need} number${-need > 1 ? "s" : ""} first`, true); notice(`You chose ${S.count} numbers but placed ${have}. Tap one to remove it.`, true); return; }
  notice("Checking your numbers…");
  setTimeout(() => {
    const res = solveTour(S.fixed);
    if (!res.path) {
      notice("");
      return forbid(res.proven
        ? "No complete knight's tour exists with these numbers. Change one and try again."
        : "No tour could be found with these numbers — they are probably impossible. Try changing one of them.", -1);
    }
    S.solution = res.path;
    S.board = new Array(64).fill(0); S.posOf = new Array(66).fill(-1); S.history = [];
    for (const k in S.fixed) setCell(S.fixed[k], +k);
    S.phase = "play"; S.start = Date.now();
    clearInterval(S.timerId); S.timerId = setInterval(() => { const t = $("time"); if (t) t.textContent = fmtTime(Date.now() - S.start); }, 1000);
    notice("Tap any empty square and type its number. Red numbers are fixed.");
    render();
    toast("Game started!"); sndStart();
  }, 30);
}

/* ---------- Play phase ---------- */
function undo() {
  const h = S.history.pop(); if (!h) return;
  setCell(h.s, h.before); notice(""); render();
}
function win(s) {
  S.phase = "won"; S.endTime = Date.now(); clearInterval(S.timerId);
  render(s); sndWin();
  $("winText").textContent = `You placed all 64 numbers in ${fmtTime(S.endTime - S.start)}. That's a complete knight's tour!`;
  setTimeout(() => openModal("win"), 450);
}
function showSolution() {
  closeModal("confirm");
  clearInterval(S.timerId); clearInterval(S.animId);
  S.phase = "solved"; S.animating = true;
  S.board = new Array(64).fill(0); S.posOf = new Array(66).fill(-1);
  for (const k in S.fixed) { S.board[S.fixed[k]] = +k; S.posOf[+k] = S.fixed[k]; }
  notice("Watch the knight…"); render();
  let n = 1;
  S.animId = setInterval(() => {
    while (n <= 64 && S.fixed[n] !== undefined) n++;
    if (n > 64) { clearInterval(S.animId); S.animating = false; notice("Here is a complete tour with your numbers."); render(); return; }
    const q = S.solution[n]; S.board[q] = n; S.posOf[n] = q; render(q); n++;
  }, 90);
}
function newGame() {
  clearInterval(S.timerId); clearInterval(S.animId); closeModal("win");
  S.phase = "setup"; S.fixed = {}; S.board = new Array(64).fill(0); S.posOf = new Array(66).fill(-1);
  S.history = []; S.solution = null; notice(""); render();
}

/* ---------- Modals & settings wiring ---------- */
function openModal(id) { $(id).classList.add("open"); }
function closeModal(id) { $(id).classList.remove("open"); }
$("gearBtn").onclick = () => {
  // grow the sheet out of the gear
  const r = $("gearBtn").getBoundingClientRect(), sh = document.querySelector("#settings .sheet"), de = document.documentElement;
  const left = (de.clientWidth - sh.offsetWidth) / 2, top = (de.clientHeight - sh.offsetHeight) / 2;
  $("settings").style.setProperty("--ox", (r.left + r.width / 2 - left) + "px");
  $("settings").style.setProperty("--oy", (r.top + r.height / 2 - top) + "px");
  openModal("settings");
};
// focus goes into the panel on open and back to the gear on close, however it closes
new MutationObserver(() => {
  if ($("settings").classList.contains("open")) $("setDone").focus({ preventScroll: true });
  else $("gearBtn").focus({ preventScroll: true });
}).observe($("settings"), { attributes: true, attributeFilter: ["class"] });
$("setDone").onclick = () => closeModal("settings");
let themeTimer = null;
$("swNight").onclick = () => {
  document.body.classList.add("theming"); clearTimeout(themeTimer); themeTimer = setTimeout(() => document.body.classList.remove("theming"), 350);
  settings.night = !settings.night; saveSettings(); applySettings();
};
$("swSound").onclick = () => { settings.sound = !settings.sound; saveSettings(); applySettings(); if (settings.sound) sndTick(); };
$("confShow").onclick = showSolution;
$("confCancel").onclick = () => closeModal("confirm");
$("winNew").onclick = newGame;
$("winClose").onclick = () => closeModal("win");
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("open"); }));
document.addEventListener("keydown", e => {
  if ($("pad").classList.contains("open")) {
    if (/^[0-9]$/.test(e.key)) padKey(e.key);
    else if (e.key === "Backspace") padKey("⌫");
    else if (e.key === "Enter") padKey("OK");
    else if (e.key === "Escape") closeModal("pad");
  } else if (e.key === "Escape") document.querySelectorAll(".modal.open,.forbid.open").forEach(m => m.classList.remove("open"));
});

applySettings();
render();
</script>
